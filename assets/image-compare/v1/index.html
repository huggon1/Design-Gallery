<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图像对比 · Design Gallery</title><style>
:root{--bg:#f5f3ee;--ink:#2d332c;--muted:#747b6e;--line:#dcded3;--accent:#446344}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}a{color:inherit;text-underline-offset:4px}.shell{max-width:1300px;margin:auto;padding:30px 44px}header{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-bottom:23px;border-bottom:1px solid var(--line)}header a{text-decoration:none}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;padding:40px 0 30px}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--accent);margin:0 0 15px}h1{font-weight:500;font-size:42px;letter-spacing:-1.5px;margin:0}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--accent);margin-left:18px;font-size:39px}.hero p{font-size:12px;line-height:1.9;color:var(--muted);margin:17px 0 0}.edition{font-family:Georgia,serif;font-size:46px;color:#c1c6b5}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.tabs{display:flex;padding:4px;border:1px solid var(--line);border-radius:9px;background:#eaece3}.tab{background:none;border:0;padding:9px 20px;border-radius:6px;font-size:12px;color:var(--muted)}.tab[aria-pressed=true]{background:#fffef9;color:var(--ink);box-shadow:0 1px 4px #203b2b0c}.reset{background:none;border:0;font-size:12px;color:var(--muted);padding:8px}.workspace{background:#e4e6db;border:1px solid #d4d8c9;border-radius:14px;padding:25px}.canvas-top{display:flex;justify-content:space-between;gap:15px;font-size:10px;letter-spacing:.08em;color:#68765b;padding-bottom:19px}.canvas-top strong{font-weight:500}.canvas{position:relative;max-width:1040px;margin:auto;aspect-ratio:10/7;background:#e8ecdf;isolation:isolate;box-shadow:0 12px 35px #263b2310;overflow:hidden;user-select:none}.canvas img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.layer{position:absolute;inset:0}.after{clip-path:inset(0 0 0 var(--split,50%))}.divider{position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;background:#fffef6;box-shadow:0 0 0 1px #263b2330;transform:translateX(-50%);pointer-events:none}.grip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffef9;color:#49603a;border-radius:50%;height:43px;width:43px;display:grid;place-items:center;box-shadow:0 3px 15px #203b2b25;font-size:18px}.range{position:absolute;inset:0;z-index:4;opacity:0;width:100%;height:100%;margin:0;cursor:ew-resize;touch-action:none}.canvas:has(.range:focus-visible){outline:3px solid #52784a;outline-offset:5px}.tag{position:absolute;top:18px;z-index:3;background:#fffef8e8;padding:6px 10px;border:1px solid #d6dcc9;border-radius:5px;color:#4b5d3c;font-size:10px;pointer-events:none}.tag-a{left:18px}.tag-b{right:18px}.side-mode{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:none;aspect-ratio:auto;overflow:visible;background:none;box-shadow:none}.side-mode .layer{position:relative;inset:auto;aspect-ratio:10/7;box-shadow:0 7px 20px #263b2310}.side-mode .after{clip-path:none}.side-mode .divider,.side-mode .range,.side-mode>.tag{display:none}.side-mode .layer:after{content:attr(data-label);position:absolute;bottom:12px;left:12px;background:#fffef7dd;color:#526345;font-size:10px;padding:5px 9px;border-radius:4px}.switch-mode .after{clip-path:none}.switch-mode .divider,.switch-mode .range,.switch-mode>.tag{display:none}.switch-mode.show-before .after{visibility:hidden}.under{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:59px;padding-top:20px;color:#68765b;font-size:11px}.hold{background:#3f6046;color:#fffef8;border:0;padding:10px 20px;border-radius:7px;font-size:12px;user-select:none;touch-action:none}.hold[aria-pressed=true]{background:#243e2a}.hold[hidden]{display:none}.readout{font-variant-numeric:tabular-nums}.notes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;padding-top:28px}.note{border-top:1px solid var(--line);padding-top:17px}.note h2{font-size:12px;font-weight:600;margin:0 0 9px}.note h2 span{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#789065;margin-right:9px}.note p{font-size:11px;line-height:1.85;color:var(--muted);margin:0}.footer{display:flex;justify-content:flex-end;gap:15px;border-top:1px solid var(--line);margin-top:33px;padding-top:16px;font-size:10px;color:var(--muted)}.sr{position:absolute;clip:rect(0,0,0,0);height:1px;width:1px;overflow:hidden}@media(max-width:700px){.shell{padding:23px 18px}.hero{padding-top:32px}h1{font-size:31px}h1 em{display:block;margin:8px 0 0;font-size:31px}.edition{display:none}.hero p{font-size:11px}.tab{padding:9px 11px;font-size:11px}.workspace{padding:12px}.canvas-top{padding-bottom:12px;font-size:9px}.tag{top:8px;padding:3px 6px;font-size:8px}.tag-a{left:8px}.tag-b{right:8px}.grip{width:34px;height:34px}.under{gap:10px;flex-wrap:wrap;line-height:1.6}.notes{grid-template-columns:1fr;gap:19px}.side-mode{gap:10px}.side-mode .layer:after{bottom:5px;left:5px;font-size:8px;padding:3px 5px}.footer{line-height:1.7}.footer span{max-width:210px}}
.gallery-home{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-family:inherit;font-size:12px;font-weight:500;letter-spacing:0}.gallery-home:hover{text-decoration:underline;text-underline-offset:4px}
</style></head><body><div class="shell"><header><a class="gallery-home" href="../../../#image-compare"><span aria-hidden="true">←</span>画廊</a><span>IMAGE COMPARISON · 03</span></header><section class="hero"><div><h1>图像对比</h1><p>比较同一张海报的两个版本，支持滑动、并排和按住切换。适合设计改版、修图和生成结果对比。</p></div></section><div class="toolbar"><div class="tabs" aria-label="比较方式"><button class="tab" data-mode="slider" aria-pressed="true">滑动</button><button class="tab" data-mode="side" aria-pressed="false">并排</button><button class="tab" data-mode="switch" aria-pressed="false">切换</button></div><button class="reset" id="reset">重置</button></div><section class="workspace" aria-label="原创海报比较"><div class="canvas-top"><strong>植物展海报</strong></div><div class="canvas" id="canvas"><div class="layer before" data-label="A · 原始排版"><img src="before.svg" alt="原始海报：暖米色底，较小的标题和日期，浅色植物图形" draggable="false"></div><div class="layer after" data-label="B · 层级调整"><img src="after.svg" alt="调整后海报：浅绿底，放大的标题与日期，深绿色植物图形" draggable="false"></div><span class="tag tag-a">A · 原始排版</span><span class="tag tag-b">B · 层级调整</span><div class="divider"><span class="grip">‹ ›</span></div><input class="range" id="split" type="range" min="0" max="100" value="50" aria-label="分割位置，0 显示完整改版，100 显示完整原版"></div><div class="under"><span id="hint">拖动 · ← →</span><button class="hold" id="hold" aria-pressed="false" hidden>按住看原版 · A</button><span class="readout" id="readout">A 50% / B 50%</span></div></section><footer class="footer"><a href="https://bencho.dev/" target="_blank" rel="noreferrer">参考 Bencho ↗</a></footer><div id="status" class="sr" role="status" aria-live="polite"></div></div><script>
const canvas=document.querySelector('#canvas'),split=document.querySelector('#split'),hold=document.querySelector('#hold'),readout=document.querySelector('#readout'),hint=document.querySelector('#hint');let mode='slider';
function release(){canvas.classList.remove('show-before');hold.setAttribute('aria-pressed','false');if(mode==='switch')readout.textContent='正在看 B · 层级调整';}
function press(){canvas.classList.add('show-before');hold.setAttribute('aria-pressed','true');readout.textContent='正在看 A · 原始排版';}
function setMode(value){release();mode=value;canvas.className='canvas '+(mode==='side'?'side-mode':mode==='switch'?'switch-mode':'');split.tabIndex=mode==='slider'?0:-1;hold.hidden=mode!=='switch';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));hint.textContent={slider:'拖动 · ← →',side:'完整画幅 · A / B',switch:'按住看 A · 松开看 B'}[mode];if(mode==='slider')updateSplit();else readout.textContent=mode==='side'?'A 原始排版 / B 层级调整':'正在看 B · 层级调整';}
function updateSplit(){canvas.style.setProperty('--split',split.value+'%');readout.textContent=`A ${split.value}% / B ${100-Number(split.value)}%`;}
split.addEventListener('input',updateSplit);document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));hold.addEventListener('pointerdown',e=>{if(e.button!==0)return;hold.setPointerCapture(e.pointerId);press();});hold.addEventListener('pointerup',release);hold.addEventListener('pointercancel',release);hold.addEventListener('lostpointercapture',release);hold.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();press();}});hold.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();release();}});hold.addEventListener('blur',release);window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});document.querySelector('#reset').addEventListener('click',()=>{split.value=50;setMode('slider');document.querySelector('#status').textContent='已恢复滑动比较，分割线位于中间。';});updateSplit();
</script></body></html>
