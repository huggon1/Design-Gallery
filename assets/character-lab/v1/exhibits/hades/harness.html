<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zagreus · 基础剑练习场</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10191c;color:#e2dac4;font:13px/1.6 system-ui}header{padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #35443c}h1{font:500 21px Georgia,serif;margin:0}header p{font-size:11px;color:#9aafa3;margin:5px 0 0}a{color:#c8b78e;text-decoration:none}main{max-width:1320px;margin:auto}canvas{display:block;width:100%;aspect-ratio:1.65;max-height:77vh;min-height:350px;outline:0;touch-action:none}nav,footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 25px;border-top:1px solid #35443c}button{font:12px system-ui;background:#26362e;color:#dddbc7;border:1px solid #526553;border-radius:3px;padding:7px 13px;cursor:pointer}button:hover,button.active{border-color:#cb956a;background:#43382c}.spacer{flex:1}label{font-size:11px;color:#9eafa0}input{accent-color:#df9c6b}footer{font-size:11px;color:#9fb1a5}#status{font-family:monospace;color:#c0c9a8}.touch{display:none;padding:12px 20px;justify-content:space-between}.dpad{display:grid;grid-template-columns:repeat(3,43px);gap:5px}.dpad button{padding:12px 0}.actions{display:flex;gap:10px}.actions button{width:74px;border-radius:50%;height:65px;touch-action:none}button{touch-action:none;user-select:none}@media(pointer:coarse){.touch{display:flex}}@media(max-width:600px){header{padding:14px 16px}h1{font-size:17px}canvas{min-height:390px}nav,footer{padding:10px 16px;gap:6px}button{padding:7px 10px}.spacer{display:none}#status{width:100%}}
</style></head><body><header><div><h1>Zagreus · 基础剑走位与冲刺斩</h1><p>HADES / 基础剑 · 持剑跑与冲刺前刺</p></div><a href="v3/comparison.html">查看原版与试玩连续对照 ↗</a></header><main><canvas tabindex="0" aria-label="Zagreus 基础剑练习场"></canvas><nav id="sections"></nav><nav><button id="pause">暂停</button><button id="reset">复位</button><button id="audio">开启声音</button><label><input id="paths" type="checkbox">位移轨迹</label><label><input id="anchors" type="checkbox">角色挂点</label><label title="在训练片有清晰人物的方向，查看分离出的原片姿态"><input id="samples" type="checkbox">固定角度实录取样</label><span class="spacer"></span><span id="status"></span></nav><div class="touch"><div class="dpad"><span></span><button data-input="up">↑</button><span></span><button data-input="left">←</button><span></span><button data-input="right">→</button><span></span><button data-input="down">↓</button></div><div class="actions"><button data-input="attack">挥剑</button><button data-input="dash">冲刺</button></div></div><footer>WASD / 方向键 走位 · L / Space 冲刺 · J / 左键 普攻 · 冲刺中 J 触发冲刺斩 · P 暂停 · R 复位<span class="spacer"></span>左上 / 右上冲刺接剑，可看肩、握柄和剑尖沿同一条斜线伸出</footer></main><script type="module">
import {createScene} from './scene.mjs';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),scene=window.scene=await createScene({canvas}),input=window.input={},map={KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyL:'dash',Space:'dash',KeyJ:'attack',KeyK:'attack'};let paused=false,muted=true,section='link';scene.reset(section);
const pause=()=>{paused=!paused;window.paused=paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';clear();};
function clear(){for(const k in input)delete input[k];scene.clearInput();}
for(const s of scene.sections){const b=document.createElement('button');b.textContent=s.label;b.dataset.section=s.id;b.onclick=()=>{section=s.id;scene.reset(section);clear();for(const q of document.querySelectorAll('[data-section]'))q.classList.toggle('active',q===b);canvas.focus();};document.querySelector('#sections').append(b);if(s.id===section)b.classList.add('active');}
addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(map[e.code]){e.preventDefault();input[map[e.code]]=true;}if(!e.repeat&&e.code==='KeyP')pause();if(!e.repeat&&e.code==='KeyR'){scene.reset(section);clear();}});addEventListener('keyup',e=>{if(map[e.code])input[map[e.code]]=false;});addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{if(document.hidden)clear();});
canvas.onpointermove=e=>{const b=canvas.getBoundingClientRect();input.aim={x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height,active:e.pointerType==='mouse'};};canvas.onpointerdown=e=>{canvas.focus();if(!muted)scene.unlockAudio();if(e.pointerType==='mouse'&&e.button===0)input.attack=true;};addEventListener('pointerup',()=>{input.attack=false;});canvas.onpointerleave=()=>{if(input.aim)input.aim.active=false;};canvas.oncontextmenu=e=>e.preventDefault();
for(const b of document.querySelectorAll('[data-input]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input[b.dataset.input]=true;if(!muted)scene.unlockAudio();};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>input[b.dataset.input]=false);}
document.querySelector('#pause').onclick=pause;document.querySelector('#reset').onclick=()=>{scene.reset(section);clear();};document.querySelector('#audio').onclick=e=>{muted=!muted;if(!muted)scene.unlockAudio();scene.setMuted(muted);e.target.textContent=muted?'开启声音':'声音已开启';};for(const id of ['paths','anchors','samples'])document.querySelector('#'+id).onchange=e=>{scene.setOption(id,e.target.checked);canvas.focus();};
let last=performance.now(),acc=0;function loop(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(!paused){acc+=dt;while(acc>=scene.fixedStep){scene.step(scene.fixedStep,input);acc-=scene.fixedStep;}}else acc=0;const b=canvas.getBoundingClientRect(),dpr=devicePixelRatio;if(canvas.width!==Math.round(b.width*dpr)||canvas.height!==Math.round(b.height*dpr)){canvas.width=Math.round(b.width*dpr);canvas.height=Math.round(b.height*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);scene.draw(ctx,{width:b.width,height:b.height,interpolationAlpha:paused?1:acc/scene.fixedStep,debug:false});const s=scene.getState();document.querySelector('#status').textContent=`${s.action} / ${s.animation.frame+1}f / ${s.charges} 冲刺 / ${s.hits} 命中`;requestAnimationFrame(loop);}requestAnimationFrame(loop);window.ready=true;window.capture60=async()=>{const stream=canvas.captureStream(60);for(const t of scene.getAudioStream().getAudioTracks())stream.addTrack(t);const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:8000000}),chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const done=new Promise(resolve=>recorder.onstop=async()=>{const b=new Blob(chunks,{type:recorder.mimeType}),a=new Uint8Array(await b.arrayBuffer());let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));resolve({base64:btoa(s),bytes:b.size,mime:recorder.mimeType,videoSettings:stream.getVideoTracks()[0].getSettings(),audioTracks:stream.getAudioTracks().length});});recorder.start(500);return {stop:async()=>{recorder.stop();return done;}};};
</script></body></html>
