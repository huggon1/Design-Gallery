<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <title>二维角色动作</title>
  <desc>匿名人物的跑动、跳跃与空中冲刺剪影，连接简洁平台和运动轨迹。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#c9c0cc" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="ground" x1="90" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46505c" stop-opacity=".2"/><stop offset=".45" stop-color="#76818a" stop-opacity=".65"/><stop offset="1" stop-color="#46505c" stop-opacity=".2"/>
    </linearGradient>
    <g id="run" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="4" cy="-90" r="13" fill="currentColor" stroke="none"/>
      <path d="M-2-64-11-33M-1-61 20-46 35-58M-4-60-29-48-38-27M-11-33 13-12 35-14M-11-33-26-7-48 0"/>
    </g>
    <g id="jump" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="2" cy="-94" r="13" fill="currentColor" stroke="none"/>
      <path d="M0-67-6-36M0-63 24-77 34-98M-1-62-24-49-37-61M-6-36 19-20 39-32M-6-36-27-13-21 5"/>
    </g>
    <g id="dash" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="36" cy="-52" r="13" fill="currentColor" stroke="none"/>
      <path d="M11-48-18-32M8-46-10-61-26-57M9-46 27-26 44-24M-18-32-45-34-67-16M-18-32-30-8-52 0"/>
    </g>
  </defs>
  <rect width="1200" height="560" fill="#191b23"/>
  <rect x="40" y="40" width="1120" height="480" fill="url(#grid)"/>
  <path d="M80 390H365M716 319H892M1003 248H1130" stroke="url(#ground)" stroke-width="2"/>
  <path d="M80 392H365V408H80ZM716 321H892V337H716ZM1003 250H1130V266H1003Z" fill="#ffffff" fill-opacity=".025"/>
  <path d="M120 426H1120" stroke="#99929f" stroke-opacity=".12"/>
  <path d="M120 422V430M320 422V430M520 422V430M720 422V430M920 422V430M1120 422V430" stroke="#99929f" stroke-opacity=".3"/>
  <path d="M121 359H286" stroke="#b0a6b2" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 9"/>
  <path d="M311 358C382 358 397 225 515 191C608 164 661 226 719 291" stroke="#edbb95" stroke-opacity=".55" stroke-width="2" stroke-dasharray="4 8"/>
  <path d="M818 257H1027" stroke="#edbb95" stroke-opacity=".5" stroke-width="2"/>
  <path d="M1019 252 1027 257 1019 262" stroke="#edbb95" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="311" cy="358" r="4" fill="#edbb95"/>
  <circle cx="719" cy="291" r="4" fill="#edbb95"/>
  <path d="M481 181H489M485 177V185" stroke="#edbb95" stroke-opacity=".65"/>
  <g color="#b1a6b5" opacity=".12"><use href="#run" transform="translate(195 388)"/></g>
  <g color="#b1a6b5" opacity=".26"><use href="#run" transform="translate(229 388)"/></g>
  <g color="#e5ddd8"><use href="#run" transform="translate(266 388)"/></g>
  <g color="#edbb95" opacity=".14"><use href="#jump" transform="translate(421 305) scale(.91)"/></g>
  <g color="#edbb95" opacity=".28"><use href="#jump" transform="translate(464 272) scale(.96)"/></g>
  <g color="#edbb95"><use href="#jump" transform="translate(513 253)"/></g>
  <g color="#b1a6b5" opacity=".12"><use href="#dash" transform="translate(810 281)"/></g>
  <g color="#b1a6b5" opacity=".26"><use href="#dash" transform="translate(851 281)"/></g>
  <g color="#e5ddd8"><use href="#dash" transform="translate(900 281)"/></g>
  <path d="M767 237H804M752 252H821M775 269H802" stroke="#e5ddd8" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
  <g fill="#aaa1ac" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" letter-spacing="2" opacity=".65">
    <text x="250" y="469" text-anchor="middle">MOVE</text>
    <text x="514" y="469" text-anchor="middle">JUMP</text>
    <text x="902" y="469" text-anchor="middle">DASH</text>
  </g>
</svg>
