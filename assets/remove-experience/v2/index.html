<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>移除操作体验 — Design Gallery</title>
<style>
:root{--paper:#f6f5f0;--ink:#262e28;--muted:#7c8178;--line:#dedfd6;--green:#315e46;--red:#a04435}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}button,select,input{font:inherit;touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:4px}a{color:inherit;text-underline-offset:4px}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.shell{max-width:1280px;margin:auto;padding:30px 48px 32px}.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:23px;font-size:12px;letter-spacing:.06em}.brand{display:flex;gap:10px;align-items:center;font-weight:650}.brandmark{display:grid;grid-template-columns:repeat(2,6px);gap:3px;transform:rotate(-8deg)}.brandmark i{width:6px;height:6px;background:var(--green)}.quiet{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:flex-end;padding:48px 0 36px;gap:35px}.eyebrow{font-size:10px;letter-spacing:.19em;color:var(--green);margin:0 0 17px;font-weight:650}h1{font-size:clamp(38px,4vw,54px);font-weight:550;letter-spacing:-.045em;line-height:1.16;margin:0}h1 span{font-family:Georgia,serif;font-size:.89em;font-style:italic;font-weight:400;color:var(--green);margin-left:15px}.intro{font-size:13px;line-height:1.9;color:#71796f;margin:18px 0 0}.controls{border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:22px;background:#eeeee7;margin-bottom:26px;font-size:12px;min-height:53px}.controls-label{font-weight:600;display:flex;align-items:center;gap:7px}.controls-label i{width:6px;height:6px;background:#699879;border-radius:50%}.toggle{display:flex;align-items:center;gap:7px;cursor:pointer}.toggle input{accent-color:var(--green);width:15px;height:15px;margin:0}.speed{display:flex;align-items:center;gap:6px}.speed select{border:0;border-bottom:1px solid #c7ccbf;background:transparent;padding:4px 16px 4px 5px;color:var(--green);font-size:12px}.reset{margin-left:auto;border:0;background:transparent;padding:6px 0;display:flex;gap:6px;align-items:center;font-size:12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{min-width:0;background:#fffefb;border:1px solid var(--line);border-radius:17px;overflow:hidden}.panel.featured{border-color:#bbc8b7;box-shadow:0 8px 28px #24493407}.panel-head{padding:23px 25px 20px;display:flex;align-items:flex-start;gap:12px}.letter{width:28px;height:28px;border:1px solid var(--line);display:grid;place-items:center;border-radius:8px;font-family:Georgia,serif;font-size:15px}.featured .letter{color:var(--green);border-color:#d3dfd0;background:#eaf0e5}.panel h2{font-size:16px;letter-spacing:-.03em;margin:2px 0 6px;font-weight:600}.list-top{margin:0 25px;border-top:1px solid var(--line);padding:17px 0 3px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.05em;color:var(--muted)}.rows{padding:0 25px}.row{min-height:126px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #ecece4;padding:17px 0}.thumb{width:64px;height:76px;border-radius:7px;flex-shrink:0;position:relative;overflow:hidden;background:#dbe3d3;transition:opacity .3s}.thumb.one:before{content:"";position:absolute;width:44px;height:58px;border:1px solid #829473;left:15px;top:20px;border-radius:25px 25px 0 0;box-shadow:-10px -10px 0 -1px #dbe3d3,-10px -10px 0 0 #a5b397}.thumb.one:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#c4d0b9;left:9px;top:11px}.thumb.two{background:#e5dfed}.thumb.two:before,.thumb.two:after{content:"";position:absolute;width:35px;height:35px;border-radius:50%;background:#a49aaf;left:8px;top:15px;box-shadow:14px 14px 0 #c9bfd5}.thumb.two:after{width:19px;height:19px;background:#f1ebf6;left:23px;top:29px;box-shadow:none}.thumb.three{background:#f0dccd}.thumb.three:before{content:"";position:absolute;inset:14px 9px;background:repeating-linear-gradient(0deg,transparent 0 8px,#ba897020 8px 9px)}.thumb.three:after{content:"Aa";position:absolute;left:9px;top:25px;font-family:Georgia,serif;font-size:31px;color:#986d56;letter-spacing:-3px}.row-body{min-width:0;flex:1}.row-title{font-size:12px;font-weight:550;line-height:1.5;margin:0 0 5px}.row-meta{font-size:10px;color:#93968d;margin-bottom:10px}.action-wrap{height:33px;display:flex;align-items:center;max-width:100%}.morph{display:inline-flex;align-items:center;gap:6px;border-radius:7px;min-height:32px;max-width:100%;white-space:nowrap;font-size:11px;transform-origin:left center}.morph.confirming{background:#f5eee8;padding:3px 4px 3px 10px}.morph.pending,.morph.undoing{padding:5px 9px;background:#f0f2ec;color:#718367}.morph.done{padding:3px 4px 3px 9px;background:#eef3e9;color:var(--green)}.morph.error{padding:3px 4px 3px 9px;background:#f9eee9;color:var(--red)}.mini{display:inline-flex;align-items:center;justify-content:center;gap:4px;background:transparent;border:0;border-radius:5px;padding:6px 8px;font-size:11px;line-height:16px;white-space:nowrap}.mini:hover{background:#e9ede3}.mini.remove{padding:5px 8px 5px 0;color:#81857b}.mini.remove:hover{color:var(--red);background:transparent}.mini.danger{background:var(--red);color:white}.mini.danger:hover{background:#873728}.mini.undo{background:#fffdf8;color:var(--green);box-shadow:0 1px 3px #26412a0d}.mini.retry{background:#fffaf6;color:var(--red)}.mini svg{width:13px;height:13px}.removed .thumb{opacity:.25}.removed .row-title{text-decoration:line-through;text-decoration-color:#b8bdb1;color:#90998a}.removed .row-meta{color:#a3ab9b}.spin{display:inline-block;width:12px;height:12px;border:1.5px solid #b9c8b0;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.footer{display:flex;justify-content:space-between;gap:15px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:10px;color:#94998d}.footer a{color:#737d6c}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{border:1px solid var(--line);border-radius:16px;padding:27px;width:min(420px,calc(100% - 36px));background:#fffefb;color:var(--ink);box-shadow:0 22px 90px #1c2d2820}dialog::backdrop{background:#24302940;backdrop-filter:blur(3px)}dialog h2{font-size:19px;margin:0 0 14px}dialog p{font-size:13px;line-height:1.8;color:#78806f;margin:0 0 24px;overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.dialog-actions button{padding:9px 17px;font-size:12px}.dialog-icon{color:var(--red);background:#f4e9e2;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;margin-bottom:20px}
@media(min-width:1400px){.shell{padding-top:40px}.hero{padding-top:58px;padding-bottom:42px}.row{min-height:137px}}@media(max-width:900px){.shell{padding:24px}.panel-head{padding:20px 18px}.rows{padding:0 18px}.list-top{margin:0 18px}.row{gap:10px}.thumb{width:48px;height:65px}}@media(max-width:680px){.shell{padding:22px 18px}.mast{font-size:10px;padding-bottom:20px}.hero{padding:35px 0 26px}.hero h1{font-size:38px}.hero h1 span{display:block;margin:8px 0 0;font-size:30px}.intro{font-size:12px}.controls{gap:13px 18px;flex-wrap:wrap;padding:12px}.controls-label{width:100%;font-size:10px}.controls .reset{margin-left:auto}.compare{grid-template-columns:1fr;gap:20px}.panel-head{padding:23px 20px}.rows{padding:0 20px}.row{gap:13px;min-height:128px}.thumb{width:54px;height:69px}.list-top{margin:0 20px}.footer{align-items:flex-start;line-height:1.8}.footer span{max-width:190px}.speed{font-size:11px}.toggle{font-size:11px}.morph{gap:4px}.mini{padding-left:7px;padding-right:7px}.morph.confirming{padding-left:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.intro{max-width:710px;line-height:1.95}.hero{padding-bottom:32px}.panel-head{align-items:center}.panel h2{margin:0}.rows{padding-bottom:10px}.panel.featured{border-color:var(--line);box-shadow:none}.footer{margin-top:25px}
</style></head><body><div class="shell"><header class="mast"><div class="brand"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Design Gallery <span class="quiet">/ 交互</span></div><span class="quiet">001</span></header><main>
<section class="hero"><div><p class="eyebrow">REMOVE / 001</p><h1>移除操作体验<span>Remove.</span></h1><p class="intro">同一组收藏，两种移除方式：弹窗把确认放在独立空间，适合说明较多的操作；原地确认把反馈留在条目旁，适合收藏整理等可恢复的轻量操作。两种方式都支持取消、重试与撤销，可切换延迟和单次失败，体验过程使用模拟数据。</p></div></section>
<div class="controls" aria-label="体验设置"><span class="controls-label"><i></i> 模拟</span><label class="toggle"><input type="checkbox" id="fail">单次失败</label><label class="speed">延迟 <select id="delay"><option value="800">0.8 秒</option><option value="2400">2.4 秒</option></select></label><button class="reset" id="reset"><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg>重置</button></div>
<div class="compare" id="compare"></div></main><footer class="footer"><span>2026 / INTERACTION</span><a href="https://uiarc.dev/components/confirm-morph" target="_blank" rel="noreferrer">Arc UI ↗</a></footer></div>
<dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><div class="dialog-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></svg></div><h2 id="dialog-title">移除收藏？</h2><p id="dialog-description"></p><div class="dialog-actions"><button class="mini" id="dialog-cancel" autofocus>保留</button><button class="mini danger" id="dialog-confirm">确认移除</button></div></dialog><div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
const items=[{title:'北欧生活：空间与留白',meta:'排版研究 · 今天',art:'one'},{title:'光影之间',meta:'交互观察 · 昨天',art:'two'},{title:'字里行间：一本独立杂志的排版手记',meta:'字体与阅读 · 10 月 11 日',art:'three'}];
const icon={remove:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M4 12h16m-5-5 5 5-5 5"/></svg>'};
let states,timers=new Set(),modalTarget=null;const dialog=document.querySelector('#dialog'),reduced=window.matchMedia('(prefers-reduced-motion: reduce)');const descriptions={idle:'已准备好',confirming:'等待确认',pending:'正在移除',done:'已移除，可撤销',error:'移除失败，可重试',undoing:'正在恢复'};
function announce(message){document.querySelector('#announce').textContent=message;}
function button(action,label,style=''){return `<button class="mini ${style}" data-action="${action}">${label}</button>`;}
function face(state){switch(state){case'idle':return button('ask',icon.remove+'移除','remove');case'confirming':return `<span>移除这条？</span>${button('cancel','保留')}${button('confirm','移除','danger')}`;case'pending':return '<span class="spin" aria-hidden="true"></span><span>正在移除…</span>';case'undoing':return '<span class="spin" aria-hidden="true"></span><span>正在恢复…</span>';case'done':return `${icon.check}<span>已移除</span>${button('undo','撤销','undo')}`;case'error':return `<span>移除失败</span>${button('retry','重试','retry')}${button('cancel','保留')}`;}}
function initialize(){timers.forEach(clearTimeout);timers.clear();if(dialog.open)dialog.close();modalTarget=null;states={a:items.map(()=> 'idle'),b:items.map(()=> 'idle')};document.querySelector('#fail').checked=false;document.querySelector('#delay').value='800';document.querySelector('#compare').innerHTML=['a','b'].map(lane=>`<section class="panel ${lane==='b'?'featured':''}" data-lane="${lane}" aria-label="${lane==='a'?'弹窗':'原地'}"><header class="panel-head"><span class="letter">${lane.toUpperCase()}</span><div><h2>${lane==='a'?'弹窗':'原地'}</h2></div></header><div class="list-top"><span>收藏</span><span class="count">03 条</span></div><div class="rows">${items.map((item,i)=>`<article class="row" data-index="${i}" aria-label="${item.title}"><div class="thumb ${item.art}" aria-hidden="true"></div><div class="row-body"><h3 class="row-title">${item.title}</h3><div class="row-meta">${item.meta}</div><div class="action-wrap"><div class="morph idle" tabindex="-1" role="group" aria-label="${item.title}：${descriptions.idle}">${face('idle')}</div></div></div></article>`).join('')}</div></section>`).join('');}
function rowFor(lane,i){return document.querySelector(`[data-lane="${lane}"] [data-index="${i}"]`);}
function update(lane,i,state,focus=true){states[lane][i]=state;const row=rowFor(lane,i),m=row.querySelector('.morph'),w=m.getBoundingClientRect().width;m.getAnimations().forEach(a=>a.cancel());m.className='morph '+state;m.innerHTML=lane==='a'&&state==='confirming'?'<span>等待确认…</span>':face(state);m.setAttribute('aria-label',`${items[i].title}：${descriptions[state]}`);m.setAttribute('aria-busy',String(state==='pending'||state==='undoing'));row.classList.toggle('removed',state==='done'||state==='undoing');const width=m.getBoundingClientRect().width;if(!reduced.matches&&lane==='b'&&w!==width)m.animate([{width:w+'px',overflow:'hidden'},{width:width+'px',overflow:'hidden'}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'});const panel=row.closest('.panel');panel.querySelector('.count').textContent=String(states[lane].filter(s=>s!=='done'&&s!=='undoing').length).padStart(2,'0')+' 条';const step=state==='idle'?0:state==='confirming'?1:(state==='pending'||state==='undoing')?2:3;panel.querySelectorAll('[data-step]').forEach(el=>el.classList.toggle('active',Number(el.dataset.step)===step));if(focus)(m.querySelector('button')||m).focus({preventScroll:true});announce(`${lane.toUpperCase()}，${items[i].title}：${descriptions[state]}`);}
function wait(ms,fn){const timer=setTimeout(()=>{timers.delete(timer);fn();},ms);timers.add(timer);}
function execute(lane,i,undo=false){const failed=!undo&&document.querySelector('#fail').checked,delay=Number(document.querySelector('#delay').value);if(failed)document.querySelector('#fail').checked=false;update(lane,i,undo?'undoing':'pending');wait(delay,()=>{const active=rowFor(lane,i).querySelector('.morph').contains(document.activeElement);update(lane,i,undo?'idle':failed?'error':'done',active);});}
function closeModal(){if(!modalTarget)return;const [lane,i]=modalTarget;modalTarget=null;dialog.close();update(lane,i,'idle');}
document.querySelector('#compare').addEventListener('click',event=>{const btn=event.target.closest('[data-action]');if(!btn)return;const row=btn.closest('.row'),lane=row.closest('.panel').dataset.lane,i=Number(row.dataset.index),action=btn.dataset.action,state=states[lane][i];if(action==='ask'&&state==='idle'){if(lane==='a'){modalTarget=[lane,i];update(lane,i,'confirming',false);document.querySelector('#dialog-description').textContent=`《${items[i].title}》`;dialog.showModal();document.querySelector('#dialog-cancel').focus();}else update(lane,i,'confirming');}else if(action==='cancel'&&(state==='confirming'||state==='error'))update(lane,i,'idle');else if((action==='confirm'&&state==='confirming')||(action==='retry'&&state==='error'))execute(lane,i);else if(action==='undo'&&state==='done')execute(lane,i,true);});
document.querySelector('#dialog-cancel').addEventListener('click',closeModal);dialog.addEventListener('cancel',event=>{event.preventDefault();closeModal();});document.querySelector('#dialog-confirm').addEventListener('click',()=>{if(!modalTarget)return;const [lane,i]=modalTarget;modalTarget=null;dialog.close();execute(lane,i);});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!dialog.open){const row=event.target.closest('.row');if(row){const lane=row.closest('.panel').dataset.lane,i=Number(row.dataset.index);if(states[lane][i]==='confirming'){event.preventDefault();update(lane,i,'idle');}}}});document.querySelector('#reset').addEventListener('click',()=>{initialize();announce('已重置。两个版本各有三条收藏。');});initialize();
</script></body></html>
