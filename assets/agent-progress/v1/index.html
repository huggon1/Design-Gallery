<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务进度 · Design Gallery</title><style>
:root{--paper:#f5f3ec;--ink:#213e35;--muted:#66756b;--line:#dddeda;--orange:#b56339;--green:#47755e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}button,a,input{touch-action:manipulation}button{font:inherit;cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #bc723f;outline-offset:5px}header{max-width:1264px;margin:auto;padding:29px 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.wordmark{font-family:Georgia,serif;font-size:20px;letter-spacing:-.8px}.edition{font:10px ui-monospace,monospace;letter-spacing:1px}main{max-width:1168px;margin:0 auto;padding:58px 0 48px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:1.6px;color:var(--orange);margin-bottom:18px}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:44px}h1{font-weight:500;font-size:clamp(32px,3.5vw,44px);letter-spacing:-1.5px;margin:0 0 15px}.intro{max-width:660px;font-size:14px;line-height:1.9;color:var(--muted);margin:0}.stamp{border:1px solid #d2d8cd;border-radius:40px;padding:10px 15px;white-space:nowrap;color:var(--muted);font-size:12px}.stamp:before{content:"";display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:8px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:28px;align-items:start}.panel{background:#fffefa;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 35px #283b2910}.panel-head{padding:25px 28px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h2{font-size:17px;font-weight:550;margin:0}.sub{font-size:12px;color:var(--muted)}.primary{border:0;border-radius:8px;padding:12px 19px;background:var(--ink);color:#fff;white-space:nowrap}.primary:disabled{opacity:.5;cursor:default}.row{padding:0 26px;border-bottom:1px solid #e9e9e2;transition:background .3s}.row:last-child{border-bottom:0}.row[data-status=running]{background:#faf5eb}.row[data-status=failed]{background:#fcf3ee}summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:92px}summary::-webkit-details-marker{display:none}.icon{width:31px;height:31px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font:12px ui-monospace,monospace;flex-shrink:0;color:#7d897e}.row[data-status=running] .icon{border:2px solid #e9d8be;border-top-color:var(--orange);animation:spin 1.1s linear infinite;font-size:0}.row[data-status=done] .icon{background:#e6efe5;color:#38684c;border-color:#e6efe5}.row[data-status=failed] .icon{background:#f2ded3;color:#a25835;border-color:#f2ded3}.title-area{min-width:0;flex:1}.row-title{font-size:14px;font-weight:550;line-height:1.5}.row-meta{font-size:11px;color:var(--muted);margin-top:5px}.status{font-size:11px;color:var(--muted);white-space:nowrap}.row[data-status=running] .status{color:#995329}.row[data-status=failed] .status{color:#a04e2b}.row[data-status=done] .status{color:#447056}.chevron{color:#849185;font-size:17px;transition:transform .2s}details[open] .chevron{transform:rotate(90deg)}.detail{padding:0 0 21px 46px}.tool{display:inline-flex;align-items:center;gap:7px;font:10px ui-monospace,monospace;padding:5px 8px;border:1px solid #dfdfd4;border-radius:5px;background:#f6f5ee;color:#66756b;margin:0 5px 13px 0}.steps{padding:0;margin:0;list-style:none;display:flex;gap:18px;flex-wrap:wrap}.steps li{font-size:11px;color:#8a948b}.steps li:before{content:"○";margin-right:5px}.steps li.finished{color:var(--green)}.steps li.finished:before{content:"✓"}.steps li.current{color:var(--orange)}.detail-copy{color:var(--muted);font-size:12px;margin:12px 0 0;line-height:1.8}.retry{font-size:12px;color:#934a29;border:1px solid #e1c3b1;background:#fffaf5;border-radius:6px;padding:8px 11px;margin-top:12px}.aside-card{background:#e8ece2;padding:25px;border-radius:12px}.overline{font-size:11px;letter-spacing:1px;color:var(--muted)}.number{font-family:Georgia,serif;font-size:58px;letter-spacing:-3px;margin:19px 0 17px;line-height:1}.number span{font-size:22px;color:#7f8d7c;letter-spacing:0}.segments{display:flex;gap:5px;margin-bottom:17px}.segment{height:5px;flex:1;background:#d1d8cb;border-radius:3px;transition:background .3s}.segment.done{background:#55745a}.segment.failed{background:var(--orange)}.segment.running{background:#d9b376}.summary{font-size:13px;line-height:1.8;min-height:48px}.running-label{font-size:11px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px solid #cfd8c9}.controls{padding:24px 3px}.toggle{display:flex;gap:10px;align-items:center;font-size:12px;cursor:pointer;line-height:1.7}.toggle input{accent-color:var(--ink);width:16px;height:16px}.reset{display:inline-block;margin-top:22px;border:0;background:transparent;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:5px}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:45px;font-size:10px;color:#7a887c;line-height:1.8}.footer a{text-underline-offset:3px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1240px){main{padding:48px 36px}header{padding:25px 36px}}@media(max-width:760px){header{padding:20px 22px}.edition{display:none}main{padding:34px 22px}.hero{display:block;margin-bottom:28px}.stamp{display:inline-block;margin-top:18px}.workspace{grid-template-columns:1fr;gap:20px}.aside{display:grid;grid-template-columns:1fr 1fr;gap:20px}.aside-card{padding:20px}.number{font-size:46px}.controls{padding-top:15px}.panel-head{padding:20px 18px}.row{padding:0 17px}summary{gap:10px;min-height:90px}.row-title{font-size:13px}.row-meta{font-size:10px}.status{font-size:10px}.detail{padding-left:40px}.primary{padding:11px 13px;font-size:12px}.footer{display:block}.footer>*{margin-top:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.row[data-status=running] .icon{font-size:12px}}

</style></head><body><header><a class="gallery-home" href="../../../#agent-progress"><span aria-hidden="true">←</span>画廊</a><span class="edition">AGENT PROGRESS / V1</span></header><main><section class="hero"><div><h1>任务进度</h1><p class="intro">整理五条模拟参考，查看每项任务的进度，并重试失败项。适合批量导入、内容整理等需要逐项反馈的任务。</p></div></section><div class="workspace"><section class="panel" aria-label="参考整理任务"><div class="panel-head"><div><h2>参考</h2></div><button class="primary" id="start">开始整理 <span aria-hidden="true">↗</span></button></div><div id="rows"></div></section><aside class="aside"><div class="aside-card"><div class="overline">本次整理</div><div class="number"><b id="count" style="font-weight:400">0</b> <span>/ 5</span></div><div class="segments" aria-hidden="true"></div><div class="summary" id="summary" role="status" aria-live="polite">5 条参考待整理。</div><div class="running-label" id="current">等待开始</div></div><div class="controls"><label class="toggle"><input id="fault" type="checkbox" checked>第 3 条失败一次</label><button class="reset" id="reset">重置</button></div></aside></div><footer class="footer"><div>参考 <a href="https://beautifului.dev/#task-rows" target="_blank" rel="noreferrer">Beautiful UI · Task Rows / Tool Chips ↗</a></div></footer></main><script>
const items=[{title:'原地确认',source:'Arc · Confirm morph',kind:'交互模式'},{title:'音频波形',source:'Audiocn · Waveform',kind:'媒体组件'},{title:'列表排序',source:'Bencho · Reorder list',kind:'微交互'},{title:'渐变封面',source:'23rd · Shader gradient',kind:'动态视觉'},{title:'任务进度',source:'Beautiful UI · Task rows',kind:'任务反馈'}];
const phases=['提取摘要','识别特点','保存笔记'];let run=0,busy=false,faultRun=true;const timers=new Map();const rows=document.querySelector('#rows');
items.forEach((item,i)=>{item.status='queued';item.step=-1;const el=document.createElement('article');el.className='row';el.dataset.status='queued';el.innerHTML=`<details><summary aria-label="${item.title}，展开步骤详情"><span class="icon">0${i+1}</span><span class="title-area"><span class="row-title">${item.title}</span><div class="row-meta">${item.source}</div></span><span class="status">排队中</span><span class="chevron" aria-hidden="true">›</span></summary><div class="detail"><ol class="steps">${phases.map(x=>`<li>${x}</li>`).join('')}</ol><p class="detail-copy">等待处理。</p><button class="retry" hidden>重试</button></div></details>`;rows.append(el);item.el=el;el.querySelector('.retry').addEventListener('click',()=>retry(i));});
const segments=document.querySelector('.segments');items.forEach(()=>segments.append(document.createElement('span')));const start=document.querySelector('#start'),fault=document.querySelector('#fault');
function paint(){items.forEach((x,i)=>{const e=x.el;e.dataset.status=x.status;e.querySelector('.icon').textContent=x.status==='done'?'✓':x.status==='failed'?'!':String(i+1).padStart(2,'0');e.querySelector('.status').textContent={queued:'排队中',running:phases[x.step]+'…',done:'已保存',failed:'需要重试'}[x.status];e.querySelectorAll('.steps li').forEach((el,n)=>el.className=x.status==='done'||n<x.step?'finished':x.status==='running'&&n===x.step?'current':'');e.querySelector('.detail-copy').textContent=x.status==='done'?'摘要和设计特点已保存。':x.status==='failed'?'读取来源超时，已保留摘要。重试将从「识别特点」继续。':x.status==='running'?['正在读取来源并提取核心摘要。','正在识别可复用的设计特点。','正在将摘要与设计特点保存到参考笔记。'][x.step]:'等待处理。';e.querySelector('.retry').hidden=x.status!=='failed';e.querySelector('.retry').disabled=busy;segments.children[i].className='segment '+x.status;});const done=items.filter(x=>x.status==='done').length;const failed=items.filter(x=>x.status==='failed').length;document.querySelector('#count').textContent=done;const summary=document.querySelector('#summary');summary.textContent=busy?`已保存 ${done} 条${failed?`，${failed} 条需要重试`:'，其余正在整理'}。`:done===5?'已整理 5 条参考。':failed?`已保存 ${done} 条，${failed} 条需要重试。`:'5 条参考待整理。';const active=items.findIndex(x=>x.status==='running');document.querySelector('#current').hidden=active<0;document.querySelector('#current').textContent=active>=0?`正在整理第 ${active+1} 条 · ${phases[items[active].step]}`:done===5?'本轮完成 · 结果已保留':failed?'本轮结束 · 等待单项重试':'等待开始';start.disabled=busy||items.some(x=>x.status!=='queued');start.textContent=busy?'整理中…':done===5?'整理完成 ✓':failed?'本轮已结束':'开始整理 ↗';fault.disabled=busy||items.some(x=>x.status!=='queued');}
function sleep(ms){return new Promise(resolve=>{const id=setTimeout(()=>{timers.delete(id);resolve(true)},ms);timers.set(id,resolve)})}
async function process(i,token,isRetry=false){const x=items[i];for(let step=isRetry?1:0;step<3;step++){if(token!==run)return;x.status='running';x.step=step;paint();await sleep(720);if(token!==run)return;if(i===2&&faultRun&&!isRetry&&step===1){x.status='failed';x.el.querySelector('details').open=true;paint();return;}}x.status='done';paint();}
start.addEventListener('click',async()=>{if(busy||items.some(x=>x.status!=='queued'))return;busy=true;faultRun=fault.checked;const token=++run;paint();for(let i=0;i<items.length;i++){await process(i,token);if(token!==run)return;}busy=false;paint();});
async function retry(i){if(busy||items[i].status!=='failed')return;busy=true;const token=++run;await process(i,token,true);if(token!==run)return;busy=false;paint();items[i].el.querySelector('summary').focus();}
document.querySelector('#reset').addEventListener('click',()=>{run++;for(const[id,resolve]of timers){clearTimeout(id);resolve(false)}timers.clear();busy=false;items.forEach(x=>{x.status='queued';x.step=-1;x.el.querySelector('details').open=false});paint();});
window.addEventListener('pagehide',()=>{run++;for(const[id,resolve]of timers){clearTimeout(id);resolve(false)}timers.clear()});paint();
</script></body></html>
